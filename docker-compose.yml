services:
  calm-portfolio:
    build:
      context: .
      args:
        # 要用长桥自动同步时改成 longport, 然后 docker compose build
        EXTRA_PACKAGES: ""
    container_name: calm-portfolio
    restart: unless-stopped
    ports:
      - "3457:3457"
    env_file:
      - .env
    volumes:
      - ./data:/data
